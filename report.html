<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>일간 보고서 · PER Observatory</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6ef;color:#2e4437;font:15px/1.7 system-ui,'Malgun Gothic',sans-serif}main{max-width:1080px;margin:30px auto;padding:24px}a{color:#466d45}header,.tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}h1{font-size:30px;margin:20px 0 4px}.sub{color:#667961}.tools{justify-content:flex-start;margin:20px 0}button{border:1px solid #cbd8c4;background:white;border-radius:8px;padding:11px 16px;cursor:pointer;color:#34522e}button:first-child{background:#43663d;color:white}textarea{width:100%;height:65vh;padding:24px;border:1px solid #d0dcca;border-radius:12px;resize:vertical;background:white;font:14px/1.8 ui-monospace,monospace;color:#283c30}.notice{padding:12px 16px;background:#eaf0e4;border-radius:8px}#print{display:none;white-space:pre-wrap}small{display:block;color:#718269}@media print{header,.tools,textarea,small,.notice,.sub{display:none}#print{display:block}main{margin:0;padding:0}h1{font-size:21px}}</style></head><body><main><header><a href="./">← 종목 분석</a><a id="archive" href="./reports/">원본 보고서</a></header><h1>일간 보고서</h1><p class="sub" id="basis">실제 API 수집 자료를 불러옵니다.</p><p class="notice">자동 초안을 수정해서 개인 보고서를 작성할 수 있습니다. 수정본은 이 브라우저에 저장되며 공개 저장소에는 올라가지 않습니다.</p><div class="tools"><button id="save">개인 수정본 저장</button><button id="download">Markdown 내려받기</button><button id="pdf">인쇄 / PDF</button><button id="reset">최신 자동 초안으로 교체</button><span id="status" role="status"></span></div><textarea id="editor" aria-label="일간 보고서 편집"></textarea><small>자료 기준일과 작성일은 다릅니다. 미제공 전망치는 생성하지 않습니다. 개인 수정본은 브라우저 데이터 삭제 시 사라질 수 있으므로 내려받아 보관하세요.</small><pre id="print"></pre></main><script type="module">let data,key;const $=s=>document.getElementById(s),message=s=>$('status').textContent=s;try{const r=await fetch('./data/daily.json',{cache:'no-store'});if(!r.ok)throw Error('수집 파일 조회 실패');data=await r.json();key='stock-daily-report:'+data.reportDate;$('editor').value=localStorage.getItem(key)||data.report||'보고서 초안이 없습니다.';$('basis').textContent='보고서 '+data.reportDate+' · 수집 '+new Date(data.generatedAt).toLocaleString('ko-KR')+' · 시세 기준일 '+(data.items.find(i=>i.file==='quotes_min.json')?.data.as_of_iso||'미확인');$('archive').href='./reports/'+data.reportDate+'.md'}catch(e){message(e.message)}$('save').onclick=()=>{if(!key)return;try{localStorage.setItem(key,$('editor').value);message('개인 수정본 저장 완료')}catch{message('저장 공간을 확인해주세요. 내려받기는 가능합니다.')}};$('download').onclick=()=>{const u=URL.createObjectURL(new Blob([$('editor').value],{type:'text/markdown;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='주식_일간보고서_'+(data?.reportDate||'초안')+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('pdf').onclick=()=>{$('print').textContent=$('editor').value;window.print()};$('reset').onclick=()=>{if(data&&confirm('편집 중인 내용을 최신 자동 초안으로 교체할까요?')){$('editor').value=data.report;message('초안 교체 완료 · 저장 버튼을 누르면 개인 수정본에 반영됩니다.')}};</script></body></html>
